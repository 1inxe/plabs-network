server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/security-headers.conf;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  location /api/market/ {
    proxy_pass https://app.plabs.online/dex-matcher/;
    proxy_ssl_server_name on;
    proxy_set_header Host app.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location /api/monad/ {
    proxy_pass https://monad-indexer.plabs.online/;
    proxy_ssl_server_name on;
    proxy_set_header Host monad-indexer.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location /api/ethereum/ {
    proxy_pass https://eth-indexer.plabs.online/;
    proxy_ssl_server_name on;
    proxy_set_header Host eth-indexer.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location /api/platform/ {
    proxy_pass https://api.plabs.online/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location ~* \.map$ { return 404; }
  location ~* ^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css|woff2?)$ {
    try_files $uri =404;
    expires 1y;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1d;
  }
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
