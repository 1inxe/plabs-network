# conf.d files are included in nginx's http context. Only explicitly trusted
# terminating proxies may set the external protocol; add your LB CIDR here.
geo $jubjub_trusted_proxy {
  default 0;
  127.0.0.1 1;
  ::1 1;
}
map "$jubjub_trusted_proxy:$http_x_forwarded_proto" $jubjub_request_scheme {
  default $scheme;
  "1:http" http;
  "1:https" https;
}
map "$request_method:$request_uri" $jubjub_request_allowed {
  default 0;
  "~^GET:/api/jubjub/(config|summary|me)$" 1;
  "~^GET:/api/jubjub/history(\?after=(0|[1-9][0-9]{0,15}))?$" 1;
  "~^POST:/api/jubjub/(auth/challenge|auth/session|bids/prepare|refund)$" 1;
}
map "$request_method:$http_content_type" $jubjub_json_allowed {
  default 0;
  "~^GET:" 1;
  "~*^POST:application/json(;[ ]*charset=utf-8)?$" 1;
}
map $http_authorization $jubjub_authorization_allowed {
  default 0;
  "" 1;
  "~*^Bearer [!-~]{1,16384}$" 1;
}
map $http_sec_fetch_site $jubjub_fetch_allowed {
  default 0;
  "" 1;
  "same-origin" 1;
  "none" 1;
}

# NFT Launch uses a separate service; only status and eligibility checks are exposed.
map "$request_method:$request_uri" $nft_request_allowed {
  default 0;
  "~^GET:/api/nft/pool/0x[0-9a-f]{40}$" 1;
  "POST:/api/nft/whitelist/check" 1;
}

map "$request_method:$request_uri" $nft_media_allowed {
  default 0;
  "~^GET:/api/nft-media/collections/[0-9a-f]{64}/manifest[.]json$" 1;
  "~^GET:/api/nft-media/objects/[0-9a-f]{64}[.]webp$" 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  include /etc/nginx/security-headers.conf;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  location /api/market/ {
    proxy_pass https://app.plabs.online/dex-matcher/;
    proxy_ssl_server_name on;
    proxy_set_header Host app.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location /api/monad/ {
    proxy_pass https://monad-indexer.plabs.online/;
    proxy_ssl_server_name on;
    proxy_set_header Host monad-indexer.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location /api/ethereum/ {
    proxy_pass https://eth-indexer.plabs.online/;
    proxy_ssl_server_name on;
    proxy_set_header Host eth-indexer.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location /api/platform/ {
    proxy_pass https://api.plabs.online/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.plabs.online;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_read_timeout 15s;
    limit_except GET { deny all; }
  }
  location /api/nft-media/ {
    if ($nft_media_allowed = 0) { return 404; }
    proxy_pass https://media.plabs.online/;
    proxy_ssl_server_name on;
    proxy_pass_request_headers off;
    proxy_set_header Host media.plabs.online;
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @nft_redirect_blocked;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10s;
    limit_except GET { deny all; }
  }
  location /api/nft/ {
    default_type application/json;
    client_max_body_size 16k;
    client_body_timeout 10s;
    set $nft_expected_origin "$jubjub_request_scheme://$http_host";
    set $nft_origin_allowed 0;
    if ($http_origin = "") { set $nft_origin_allowed 1; }
    if ($http_origin = $nft_expected_origin) { set $nft_origin_allowed 1; }
    if ($nft_origin_allowed = 0) { return 403 '{"error":"Request origin is not allowed."}'; }
    if ($jubjub_fetch_allowed = 0) { return 403 '{"error":"Request origin is not allowed."}'; }
    if ($nft_request_allowed = 0) { return 400 '{"error":"Unsupported NFT method, path or query."}'; }
    if ($jubjub_json_allowed = 0) { return 415 '{"error":"JSON content type is required."}'; }
    if ($http_content_encoding != "") { return 415 '{"error":"Encoded request bodies are not supported."}'; }
    proxy_pass https://app.plabs.online/nft-intake/v1/;
    proxy_ssl_server_name on;
    proxy_pass_request_headers off;
    proxy_set_header Host app.plabs.online;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept application/json;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_redirect off;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @nft_redirect_blocked;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }
  location @nft_redirect_blocked {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":"NFT service redirected an API request."}';
  }
  location /api/jubjub/ {
    default_type application/json;
    client_max_body_size 16k;
    client_body_timeout 10s;
    set $jubjub_expected_origin "$jubjub_request_scheme://$http_host";
    set $jubjub_origin_allowed 0;
    if ($http_origin = "") { set $jubjub_origin_allowed 1; }
    if ($http_origin = $jubjub_expected_origin) { set $jubjub_origin_allowed 1; }
    if ($jubjub_origin_allowed = 0) { return 403 '{"error":"Request origin is not allowed."}'; }
    if ($jubjub_fetch_allowed = 0) { return 403 '{"error":"Request origin is not allowed."}'; }
    if ($jubjub_request_allowed = 0) { return 400 '{"error":"Unsupported JubJub method, path or query."}'; }
    if ($jubjub_json_allowed = 0) { return 415 '{"error":"JSON content type is required."}'; }
    if ($jubjub_authorization_allowed = 0) { return 400 '{"error":"Only Bearer authorization is supported."}'; }
    if ($http_content_encoding != "") { return 415 '{"error":"Encoded request bodies are not supported."}'; }
    proxy_pass https://app.plabs.online/nft-jubjub/v1/;
    proxy_ssl_server_name on;
    proxy_pass_request_headers off;
    proxy_set_header Host app.plabs.online;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Accept application/json;
    proxy_set_header User-Agent $http_user_agent;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_redirect off;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @jubjub_redirect_blocked;
    error_page 413 = @jubjub_body_too_large;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }
  location @jubjub_redirect_blocked {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 502 '{"error":"JubJub redirected an API request."}';
  }
  location @jubjub_body_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":"JubJub request body is too large."}';
  }
  location ~* \.map$ { return 404; }
  location ~* "^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css|woff2?)$" {
    try_files $uri =404;
    expires 1y;
  }
  location /assets/ {
    try_files $uri =404;
    expires 1d;
  }
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
